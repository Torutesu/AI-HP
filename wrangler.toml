# Cloudflare Pages configuration (lives at the repo root — the Next.js app).
# Lets both the dashboard Git integration and `wrangler pages deploy` pick up
# the build output + Functions without manual setup. The Cloudflare project's
# root directory is the repository root (leave the "Root directory" field empty).

name = "ai-hp"
compatibility_date = "2025-06-01"
pages_build_output_dir = "out"

# --- Lead store (Phase 1) --------------------------------------------------
# D1 database binding, exposed to Functions as `env.DB`.
# Easiest path for GitHub-connected Pages: create the DB, then add the binding
# in the dashboard (Settings → Functions → Bindings → D1) with variable name DB.
#   1) wrangler d1 create ai-hp-leads
#   2) wrangler d1 execute ai-hp-leads --file=./db/schema.sql --remote
# If you prefer to bind here instead of the dashboard, uncomment and set the id:
# [[d1_databases]]
# binding = "DB"
# database_name = "ai-hp-leads"
# database_id = "<your-d1-database-id>"
#
# Workers AI binding (Phase 3 — lead enrichment), exposed as `env.AI`.
# Add in the dashboard (Settings → Functions → Bindings → Workers AI, name AI),
# or uncomment:
# [ai]
# binding = "AI"
