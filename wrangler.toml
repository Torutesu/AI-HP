# Cloudflare Pages configuration (lives at the repo root — the Next.js app).
# Lets both the dashboard Git integration and `wrangler pages deploy` pick up
# the build output + Functions without manual setup. The Cloudflare project's
# root directory is the repository root (leave the "Root directory" field empty).

name = "ai-hp"
compatibility_date = "2025-06-01"
pages_build_output_dir = "out"

# --- Lead store bindings (managed here; the dashboard is read-only when a
#     wrangler.toml is present) ------------------------------------------------
# D1 database → env.DB. Apply the schema once:
#   wrangler d1 execute ai-hp-leads --file=./db/schema.sql --remote
# (or paste db/schema.sql into the D1 Console in the dashboard).
[[d1_databases]]
binding = "DB"
database_name = "ai-hp-leads"
database_id = "68391b6e-588c-482f-b1df-87ea374a60a4"

# Workers AI (Phase 3 — lead enrichment) → env.AI
[ai]
binding = "AI"
